name: Refresh weekly digest
on:
  schedule:
    - cron: "0 1 * * 1"   # every Monday 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot + digest
        run: |
          python3 build_snapshot.py
          python3 generate_digest.py
      - name: Commit and push
        run: |
          git config user.name "aldow3n-a11y"
          git config user.email "aldow3n-a11y@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh jobs snapshot + weekly digest (auto)"
          git push
